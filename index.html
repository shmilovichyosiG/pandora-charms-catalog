<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>קטלוג חרוזי פנדורה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="wash one"></div>
    <div class="wash two"></div>

    <div class="page">

        <header class="page-header">
            <img src="logo-placeholder.png" alt="לוגו" class="site-logo" />
            <p class="results-count" id="resultsCount"></p>
        </header>

        <section class="filters-card">
            <div class="filters-row">
                <label class="filter-field">
                    <span class="filter-label">נושא</span>
                    <select id="topicFilter"></select>
                </label>

                <label class="filter-field">
                    <span class="filter-label">תת-נושא</span>
                    <select id="subTopicFilter"></select>
                </label>

                <label class="filter-field">
                    <span class="filter-label">זמינות</span>
                    <select id="availabilityFilter">
                        <option value="-- הכל --">-- הכל --</option>
                        <option value="יש">יש במלאי</option>
                        <option value="אין">אין במלאי</option>
                    </select>
                </label>
            </div>

            <div class="search-row">
                <label class="filter-field search-field">
                    <span class="filter-label">שם</span>
                    <input id="searchInput" type="text" placeholder="הקלד שם חרוז…" list="charmNamesList" autocomplete="off" />
                    <datalist id="charmNamesList"></datalist>
                </label>
                <button id="clearFiltersBtn" class="ghost-button">נקה סינון</button>
            </div>
        </section>

        <section id="charmsGrid" class="charms-grid"></section>

        <p id="emptyMessage" class="empty-message hidden">לא נמצאו חרוזים התואמים לחיפוש.</p>

    </div>

    <script src="charms-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
