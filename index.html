<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קטלוג חרוזי PANDORA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div id="resultsCount" class="results-count">טוען נתונים...</div>
            <h1 class="site-title">קטלוג חרוזי PANDORA</h1>
        </header>

        <section class="filters-section">
            <div class="filter-group">
                <label for="styleFilter">נושא</label>
                <select id="styleFilter"></select>
            </div>

            <div class="filter-group">
                <label for="publisherFilter">תת-נושא</label>
                <select id="publisherFilter"></select>
            </div>

            <div class="filter-group">
                <label for="authorFilter">זמינות</label>
                <select id="authorFilter"></select>
            </div>

            <div class="filter-group">
                <label for="searchInput">שם</label>
                <input type="text" id="searchInput" placeholder="הקלד שם חרוז..." list="bookNamesList">
                <datalist id="bookNamesList"></datalist>
            </div>

            <button id="clearFiltersBtn" class="clear-btn">נקה סינון</button>
        </section>

        <main>
            <div id="emptyMessage" class="empty-message hidden">לא נמצאו חרוזים התואמים את הסינון.</div>
            <div id="booksGrid" class="books-grid"></div>
        </main>
    </div>

    <script src="charms-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
